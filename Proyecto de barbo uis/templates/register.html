{% extends "base.html" %}
{% block title %}Registro - Ciudad Inteligente UIS{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="SmartCity UIS Logo" style="height: 64px; width: auto; margin-bottom: 0.8rem; filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.5));" />
            <h2>Crear Cuenta</h2>
            <p>Únete a la red de monitoreo urbano inteligente UIS</p>
        </div>


        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label for="username" class="form-label">Nombre de Usuario</label>
                <div class="input-with-icon">
                    <input type="text" id="username" name="username" class="form-input" placeholder="Ej: usuario1" required autocomplete="username" />
                    <i class="ri-user-line"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="email" class="form-label">Correo Electrónico</label>
                <div class="input-with-icon">
                    <input type="email" id="email" name="email" class="form-input" placeholder="correo@ejemplo.com" required autocomplete="email" />
                    <i class="ri-mail-line"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Contraseña</label>
                <div class="input-with-icon">
                    <input type="password" id="password" name="password" class="form-input" placeholder="••••••••" required autocomplete="new-password" />
                    <i class="ri-lock-2-line"></i>
                </div>
            </div>

            <button type="submit" class="btn-primary" style="background: var(--grad-cyan); margin-top: 1.5rem;">
                <i class="ri-checkbox-circle-line"></i> Completar Registro
            </button>
        </form>

        <div class="auth-footer-link">
            ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
        </div>
    </div>
</div>
{% endblock %}
